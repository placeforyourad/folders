services:
    postgres:
        image: postgres:16
        container_name: my-postgres
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: 12345
            POSTGRES_DB: mydb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d mydb"]

    app:
        build: .
        ports:
            - "3001:3001"
        environment:
            DATABASE_URL: "postgresql://user:12345@postgres:5432/mydb"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
