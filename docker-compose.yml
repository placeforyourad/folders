services:
    postgres:
        image: postgres:16
        container_name: my-postgres
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: 12345
            POSTGRES_DB: mydb
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            DATABASE_URL: "postgresql://user:12345@postgres:5432/mydb"
        depends_on:
            - postgres

volumes:
    postgres_data:
